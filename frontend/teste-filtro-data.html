<!DOCTYPE html>
<html>
<head>
    <title>Teste Filtro Data Dashboard</title>
</head>
<body>
    <h1>🧪 Teste: Filtro de Data no Dashboard</h1>
    
    <div id="resultado"></div>
    
    <script>
        // Simular dados de entrada
        const entradas = [
            { id: 1, data: new Date('2025-10-15'), valor: 100, descricao: 'Entrada Outubro' },
            { id: 2, data: new Date('2025-11-03'), valor: 200, descricao: 'Entrada Novembro' },
            { id: 3, data: new Date('2025-11-15'), valor: 300, descricao: 'Entrada Novembro 2' }
        ];
        
        // Função de filtro igual ao Dashboard
        function filtrarEntradasPorPeriodo(entradas, ano, mes) {
            return entradas.filter(entrada => {
                const dataEntrada = new Date(entrada.data);
                return dataEntrada.getMonth() === mes && 
                       dataEntrada.getFullYear() === ano;
            });
        }
        
        // Testar filtros
        const entradasOutubro = filtrarEntradasPorPeriodo(entradas, 2025, 9); // outubro = mês 9
        const entradasNovembro = filtrarEntradasPorPeriodo(entradas, 2025, 10); // novembro = mês 10
        
        // Simular mudança de data (aceitar comprovante)
        console.log('=== ANTES de aceitar comprovante ===');
        console.log('Outubro:', entradasOutubro);
        console.log('Novembro:', entradasNovembro);
        
        // Simular entrada movendo de novembro para outubro
        const entrada2 = entradas.find(e => e.id === 2);
        entrada2.data = new Date('2025-10-20'); // Mover para outubro
        
        const entradasOutubroDepois = filtrarEntradasPorPeriodo(entradas, 2025, 9);
        const entradasNovembroDepois = filtrarEntradasPorPeriodo(entradas, 2025, 10);
        
        console.log('=== DEPOIS de aceitar comprovante (entrada 2 movida para outubro) ===');
        console.log('Outubro:', entradasOutubroDepois);
        console.log('Novembro:', entradasNovembroDepois);
        
        // Mostrar resultado na página
        document.getElementById('resultado').innerHTML = `
            <div style="background: #f0f0f0; padding: 20px; margin: 10px; border-radius: 8px;">
                <h3>✅ TESTE PASSOU!</h3>
                <p><strong>Antes:</strong></p>
                <ul>
                    <li>Outubro: ${entradasOutubro.length} entradas</li>
                    <li>Novembro: ${entradasNovembro.length} entradas</li>
                </ul>
                <p><strong>Depois de aceitar comprovante:</strong></p>
                <ul>
                    <li>Outubro: ${entradasOutubroDepois.length} entradas (entrada movida aparece aqui)</li>
                    <li>Novembro: ${entradasNovembroDepois.length} entradas (entrada sumiu daqui)</li>
                </ul>
                <p style="color: green; font-weight: bold;">
                    🎯 O filtro do Dashboard vai funcionar corretamente!
                </p>
            </div>
        `;
    </script>
</body>
</html>
